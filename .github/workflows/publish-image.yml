name: Publicar imagem Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: 678estudio-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar pnpm e Typst
        shell: bash
        run: |
          npm install --global pnpm@10.29.3
          sha="a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c"
          release="typst-x86_64-unknown-linux-musl"
          curl --fail --show-error --silent --location --retry 3 \
            "https://github.com/typst/typst/releases/download/v0.15.1/$release.tar.xz" -o /tmp/typst.tar.xz
          echo "$sha  /tmp/typst.tar.xz" | sha256sum -c -
          sudo tar -xJf /tmp/typst.tar.xz -C /usr/local/bin --strip-components=1 "$release/typst"
          typst --version
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Validar suíte completa, backup, Astro Check e build
        env:
          AGENDA_TYPST_TEST: '1'
          ASTRO_TELEMETRY_DISABLED: '1'
        run: |
          pnpm test
          python3 -B src/server/backup/test_engine.py
          pnpm exec astro check
          pnpm build

  publish:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Construir e publicar no GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$image:sha-$GITHUB_SHA" .
      - name: Verificar manifesto publicado
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-$GITHUB_SHA"
          docker buildx imagetools inspect --raw "$image" |
            jq -e '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort == ["amd64", "arm64"]'
          docker buildx imagetools inspect "$image"
      - name: Promover imagem e atualizar a stack
        if: vars.PORTAINER_AUTO_DEPLOY == 'true' && !contains(github.event.head_commit.message || '', '[publish-only]')
        env:
          GH_TOKEN: ${{ github.token }}
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          latest_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$latest_sha" != "$GITHUB_SHA" ]]; then
            echo "A branch main avançou. O próximo build acionará o webhook."
            exit 0
          fi
          docker buildx imagetools create --tag "$image:stable" "$image:sha-$GITHUB_SHA"
          if [[ -z "$PORTAINER_WEBHOOK_URL" ]]; then
            echo "Imagem stable publicada. Webhook ainda não configurado."
            exit 0
          fi
          status=$(curl --proto '=https' --silent --output /dev/null --max-time 90 \
            --write-out '%{http_code}' --request POST --url "$PORTAINER_WEBHOOK_URL") || {
              echo "::error::Falha ao acionar o webhook do Portainer."
              exit 1
            }
          if [[ "$status" != 2[0-9][0-9] ]]; then
            echo "::error::O webhook respondeu com HTTP $status."
            exit 1
          fi
